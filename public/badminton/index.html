<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>羽毛球进阶框架 Badminton Pathway | Reallife</title>
<meta name="description" content="中英对照羽毛球单打与双打进阶框架：级别、技能与达成标准。Bilingual badminton singles & doubles progression framework.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a phone app shell. Sticky header (title + language), track switches,
   a horizontal level rail styled like court tiles, then the skill list. Skills open in a bottom sheet. */
:root{
  --bg:#f3f6f3; --surface:#ffffff; --sunk:#e7eee9; --ink:#132620; --ink-2:#4b5f57; --line:#cfdcd5;
  --court:#1b6a50; --court-ink:#ffffff; --court-soft:#dcebe3;
  --cork:#c97a12; --cork-soft:#fbecd3;
  --good:#1f7a4a; --warn:#a8650c;
  --d0:#1b6a50; --d1:#2d5f9a; --d2:#8a4fa3; --d3:#b4532a; --d4:#0f7c86; --d5:#6b6a1f;
  --shadow:0 10px 30px rgba(10,40,30,.18);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1814; --surface:#13231e; --sunk:#0f1e19; --ink:#e3eee8; --ink-2:#9db3a9; --line:#26403a;
  --court:#3fae84; --court-ink:#06140f; --court-soft:#173a2f;
  --cork:#f0ad45; --cork-soft:#3a2c14;
  --good:#58c98d; --warn:#f0ad45;
  --d0:#4fbf93; --d1:#78a9e8; --d2:#c493dd; --d3:#ec9065; --d4:#4fc6cf; --d5:#c9c76a;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1814; --surface:#13231e; --sunk:#0f1e19; --ink:#e3eee8; --ink-2:#9db3a9; --line:#26403a;
  --court:#3fae84; --court-ink:#06140f; --court-soft:#173a2f;
  --cork:#f0ad45; --cork-soft:#3a2c14;
  --good:#58c98d; --warn:#f0ad45;
  --d0:#4fbf93; --d1:#78a9e8; --d2:#c493dd; --d3:#ec9065; --d4:#4fc6cf; --d5:#c9c76a;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--court)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cork);outline-offset:2px}
.en{display:block;font-size:.84em;color:var(--ink-2);line-height:1.4;margin-top:1px}
.inl-en{color:var(--ink-2);font-size:.86em}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header: court green band with faint court lines */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--court);color:var(--court-ink);
  background-image:linear-gradient(90deg,transparent calc(50% - .5px),rgba(255,255,255,.14) 0 calc(50% + .5px),transparent 0),
  linear-gradient(180deg,transparent 70%,rgba(255,255,255,.14) 0 calc(70% + 1px),transparent 0)}
.hbar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;opacity:.82;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px}
.lang button{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:500;color:inherit;opacity:.85;min-width:40px}
.lang button[aria-pressed="true"]{background:var(--court-ink);color:var(--court);opacity:1}

/* Track switches */
.switches{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:12px 4px}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink-2);line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .inl-en{display:block;font-size:11px}

/* Level rail */
.rail{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:10px 12px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tile{scroll-snap-align:start;flex:0 0 auto;width:92px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 9px 10px;text-align:left;position:relative;overflow:hidden}
.tile .ln{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.tile .ln .bdg{font-size:17px;margin-left:4px;vertical-align:2px}
.tile .nm{font-size:12.5px;font-weight:500;margin-top:4px;line-height:1.25;min-height:2.5em}
.tile .nm .inl-en{display:block;font-size:11px}
.tile .pbar{position:absolute;left:0;bottom:0;height:4px;background:var(--cork);transition:width .3s}
.tile[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.tile[aria-pressed="true"] .inl-en{color:inherit;opacity:.8}

/* Level panel */
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.ptitle{display:flex;align-items:flex-start;gap:12px}
.ptitle .big{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.9;color:var(--court)}
.ptitle h2{margin:0;font-size:19px;line-height:1.3;text-wrap:balance}
.ptitle .sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:12.5px;background:var(--sunk);border-radius:999px;padding:3px 10px;color:var(--ink-2)}
.fact b{color:var(--ink);font-weight:500}
.blk h3{margin:0 0 2px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.blk p{margin:0}
.quest{background:var(--cork-soft);border-radius:12px;padding:10px 12px}
.quest h3{color:var(--warn)}

/* Readiness */
.ready{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border-top:1px dashed var(--line);padding-top:12px}
.ring{width:54px;height:54px}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--sunk)}
.ring .fgc{stroke:var(--court);stroke-linecap:round;transition:stroke-dasharray .4s}
.ring text{font-family:var(--f-display);font-weight:700;font-size:15px;fill:var(--ink)}
.ready .rl{font-size:13px;color:var(--ink-2);line-height:1.45}
.ready .rl b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;margin-top:4px}
.chip.ok{background:var(--court-soft);color:var(--good)}
.chip.no{background:var(--sunk);color:var(--ink-2)}

/* Domain filter + skills */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 8px}
.sec-h h2{margin:0;font-size:16px}
.sec-h small{color:var(--ink-2);font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed="true"] .inl-en{color:inherit;opacity:.75}
.list{display:grid;gap:8px;margin-top:6px}
.skill{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.skill:active{transform:scale(.99)}
.code{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.02em;padding:4px 7px;border-radius:7px;color:var(--surface);background:var(--dc,var(--court));font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.skill .nm{font-weight:500;line-height:1.35;min-width:0}
.skill .dm{display:block;font-size:12px;color:var(--ink-2);font-weight:400;margin-top:2px}
.meter{display:flex;gap:3px}
.meter i{width:7px;height:18px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.meter i.on{background:var(--cork);border-color:var(--cork)}
.mixed-h{margin:14px 0 2px;font-size:13px;font-weight:500;color:var(--d2)}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:12px;color:var(--ink-2);line-height:1.2}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--court);font-weight:500}
nav.tabs .inl-en{font-size:10.5px}

/* Guide & assessment */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.card h2{margin:0 0 10px;font-size:17px;text-wrap:balance}
.card h3{margin:14px 0 6px;font-size:14px}
.grade-row{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.grade-row:first-of-type{border-top:0}
.stars{color:var(--cork);font-size:13px;letter-spacing:-1px;line-height:1}
.gnum{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.ul{margin:0;padding-left:18px;display:grid;gap:6px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0;position:relative}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--court);color:var(--court-ink);font-family:var(--f-display);font-weight:700;display:grid;place-items:center;font-size:15px}
.steps li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:36px;bottom:-4px;width:1.5px;background:var(--line)}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--ink-2);font-size:12px;border-top:0}
td.num{font-family:var(--f-display);font-weight:600;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.calc{display:grid;gap:14px}
.calc label{display:grid;gap:4px;font-size:13.5px}
.calc .row{display:flex;justify-content:space-between;align-items:baseline}
.calc output{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--court)}
.result{display:flex;align-items:center;gap:14px;background:var(--court-soft);border-radius:12px;padding:12px}
.result .big{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;color:var(--court)}
.note{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  max-height:88%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet .sh{display:flex;gap:12px;align-items:flex-start;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet .sh h2{margin:0;font-size:18px;line-height:1.3;flex:1;min-width:0;text-wrap:balance}
.sheet .sh .dm{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex:0 0 auto}
.xbtn svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.2}
.sheet .sb{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:640px;width:100%;margin:0 auto}
.hint{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.ladder{display:grid;gap:8px}
.rung{display:grid;grid-template-columns:44px 1fr;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);position:relative}
.rung .gnum{color:var(--ink-2)}
.rung .gname{font-weight:700;font-size:15px}
.rung .gdef{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.rung .crit{margin-top:8px;background:var(--sunk);border-radius:9px;padding:7px 10px;font-size:14px}
.rung .crit small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.rung.reached{border-color:var(--cork);background:linear-gradient(0deg,var(--cork-soft),var(--cork-soft))}
.rung.reached .gnum{color:var(--cork)}
.rung.current::after{content:attr(data-me);position:absolute;top:10px;right:10px;font-size:11px;font-weight:500;background:var(--cork);color:var(--surface);padding:2px 8px;border-radius:999px}
.rung.assumed{opacity:.6;border-style:dashed;cursor:default}
.sheet .acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;font-weight:500;background:var(--surface)}
.btn.pri{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--cork-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* Base reset (standalone page) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="wrap hbar">
    <div class="brand"><b id="appTitle"></b><small id="appSub"></small></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-zh" data-lang="zh">中文</button>
      <button id="lang-en" data-lang="en">EN</button>
      <button id="lang-bi" data-lang="bi">双语</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="switches">
    <div class="seg" role="group" id="fmtSeg"></div>
    <div class="seg" role="group" id="trackSeg"></div>
  </div>
  <section id="view"></section>
</main>

<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>

  ['T8',{zh:'杀球（成人 / L3+ 少儿）',en:'Smash (adults / kids L3+)'},{zh:'明显下压且入界',en:'Steep and in'}],
  ['T9',{zh:'连续对拉',en:'Rally count'},{zh:'记录最高连续拍数',en:'Max consecutive shots'}]],
 doubles:[
  ['DT1',{zh:'反手网前发球（双打）',en:'Backhand low serve (doubles)'},{zh:'过网 <20cm（少儿 <30cm），落前发球线后 50cm 内',en:'Clears net by <20cm (kids <30cm), within 50cm of short line'}],
  ['DT2',{zh:'平高球发球',en:'Flick serve'},{zh:'过接发者拍头且入界',en:"Over receiver's reach and in"}],
  ['DT3',{zh:'接发球',en:'Return of short serve'},{zh:'落 3 个目标区且不起高',en:'Into 3 target zones, not lifted'}],
  ['DT4',{zh:'平抽对抽',en:'Drive exchange'},{zh:'记录最高连续拍数',en:'Max consecutive shots'}],
  ['DT5',{zh:'接杀防守',en:'Smash defence'},{zh:'挡网 / 挑底线 / 反抽到位',en:'Quality block, deep lift or counter'}],
  ['DT6',{zh:'前场封网',en:'Net interception'},{zh:'下压且入界',en:'Downward and in'}],
  ['DT7',{zh:'连续杀球（成人 / L3+ 少儿）',en:'Repeated smash (adults / kids L3+)'},{zh:'杀球下压且回位',en:'Downward, with recovery'}]],
};
const BANDS = [[0,25,1],[26,45,2],[46,60,3],[61,75,4],[76,88,5],[89,100,6]];
const WEIGHTS = {singles:{p:20,t:50,m:30}, doubles:{p:15,t:45,m:40}};

/* ---------- State ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem('bp:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('bp:'+k,JSON.stringify(v))}catch(e){}}
};
const S = {lang:store.get('lang','bi'), fmt:store.get('fmt','singles'), track:store.get('track','kids'),
  level:store.get('level',1), tab:'levels', domain:'all', calc:{p:2.5,t:50,m:2.5,singles:0}};
let ratings = store.get('ratings',{});
let openSkill = null;

/* ---------- Text helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function T(o){ if(!o) return ''; const z=esc(o.zh), e=esc(o.en);
  if(S.lang==='zh') return z; if(S.lang==='en') return e; return z===e ? z : `${z}<span class="en">${e}</span>`; }
function TI(o){ if(!o) return ''; const z=esc(o.zh), e=esc(o.en);
  if(S.lang==='zh') return z; if(S.lang==='en') return e; return z===e ? z : `${z} <span class="inl-en">${e}</span>`; }
function TP(o){ return S.lang==='en' ? o.en : o.zh; } /* plain, for attributes */
const u = k => TI(U[k]);
const domKey = code => code.match(/^[A-Z]+/)[0];
const levelData = () => DATA[S.fmt][S.track].levels['L'+S.level];
const rKey = code => `${S.fmt}/${S.track}/${code}`;
const getR = code => ratings[rKey(code)] || 0;
const needApplied = n => n <= 2 ? 2 : 3;
const stars = n => '★'.repeat(n);

function progressFor(n){
  const sk = DATA[S.fmt][S.track].levels['L'+n].skills;
  const c3 = sk.filter(s => getR(s.code) >= 3).length;
  const c4 = sk.filter(s => getR(s.code) >= 4).length;
  return {total:sk.length, c3, c4, need:needApplied(n), ready: c3 === sk.length && c4 >= needApplied(n)};
}

/* ---------- Render: chrome ---------- */
function renderChrome(){
  document.documentElement.lang = S.lang==='en' ? 'en' : 'zh-CN';
  document.getElementById('appTitle').textContent = TP(U.title);
  document.getElementById('appSub').textContent = S.lang==='en' ? U.sub.en : U.sub.zh;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang===S.lang));
  const seg = (id, key, opts) => {
    document.getElementById(id).innerHTML = opts.map(o =>
      `<button id="${id}-${o}" data-${key}="${o}" aria-pressed="${S[key]===o}">${S.lang==='bi'?`${esc(U[o].zh)}<span class="inl-en">${esc(U[o].en)}</span>`:TI(U[o])}</button>`).join('');
  };
  seg('fmtSeg','fmt',['singles','doubles']);
  seg('trackSeg','track',['kids','adults']);
  const ic = {
    levels:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 12h16M12 3v18"/></svg>',
    guide:'<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"/></svg>',
    assess:'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 11l2 2 4-4M8.5 17h7"/></svg>'};
  document.getElementById('tabs').innerHTML = [['levels','tLevels'],['guide','tGuide'],['assess','tAssess']].map(([k,l]) =>
    `<button id="tab-${k}" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${ic[k]}<span>${esc(U[l].zh===U[l].en||S.lang!=='bi'?TP(U[l]):U[l].zh)}</span>${S.lang==='bi'?`<span class="inl-en">${esc(U[l].en)}</span>`:''}</button>`).join('');
}

/* ---------- Render: levels tab ---------- */
function ringSVG(p){
  const r=23, c=2*Math.PI*r, pct = p.total ? p.c3/p.total : 0;
  return `<svg class="ring" viewBox="0 0 54 54" aria-hidden="true"><circle class="bgc" cx="27" cy="27" r="${r}"/>
    <circle class="fgc" cx="27" cy="27" r="${r}" stroke-dasharray="${(pct*c).toFixed(1)} ${c.toFixed(1)}" ${pct?"":"hidden"} transform="rotate(-90 27 27)"/>
    <text x="27" y="32" text-anchor="middle">${p.c3}/${p.total}</text></svg>`;
}
function renderLevels(){
  const L = LEVELS[S.level-1], d = levelData(), kids = S.track==='kids', dbl = S.fmt==='doubles';
  const rail = LEVELS.map(l => { const p = progressFor(l.n);
    return `<button class="tile" id="lvl-${l.n}" data-level="${l.n}" aria-pressed="${S.level===l.n}">
      <div class="ln">L${l.n}${kids?`<span class="bdg">${l.e}</span>`:''}</div>
      <div class="nm">${kids ? TI(dbl?l.kd:l.ks) : TI(l)}</div>
      <span class="pbar" style="width:${p.total?Math.round(p.c3/p.total*100):0}%"></span></button>`; }).join('');
  const facts = [];
  facts.push(`<span class="fact">${TI(U.profile)} · <b>${TI(dbl?L.dp:(kids?L:L.ap))}</b></span>`);
  if(kids) facts.push(`<span class="fact">${TI(U.age)} · <b>${L.age} ${TP(U.years)}</b></span>`);
  facts.push(`<span class="fact">${TI(U.dur)} · <b>${L.dur} ${TP(U.months)}</b></span>`);
  if(dbl && L.entry) facts.push(`<span class="fact">${TI(U.entry)} · <b>L${L.entry}+</b></span>`);
  if(!dbl) facts.push(`<span class="fact">${TI(U.equiv)} · <b>${TI(L.eq)}</b></span>`);

  const p = progressFor(S.level);
  const doms = [...new Set(d.skills.map(s => domKey(s.code)))];
  if(S.domain!=='all' && !doms.includes(S.domain)) S.domain='all';
  const shown = d.skills.filter(s => S.domain==='all' || domKey(s.code)===S.domain);
  const core = shown.filter(s => s.group!=='mixed'), mixed = shown.filter(s => s.group==='mixed');
  const row = s => { const dk = domKey(s.code), r = getR(s.code);
    return `<button class="skill" data-skill="${s.code}" id="sk-${s.code}" style="--dc:var(--d${DOMAINS[dk].c})">
      <span class="code">${s.code}</span>
      <span class="nm">${T(s)}<span class="dm">${TI(DOMAINS[dk])}</span></span>
      <span class="meter" aria-label="${r} / 4">${[1,2,3,4].map(i=>`<i class="${i<=r?'on':''}"></i>`).join('')}</span></button>`; };

  return `<div class="rail" id="rail">${rail}</div>
  <article class="panel">
    <div class="ptitle"><div class="big">L${L.n}</div><div>
      <h2>${kids ? `${L.e} ${TI(dbl?L.kd:L.ks)}` : TI(L)}</h2>
      <div class="sub">${kids ? TI(L) : TI(dbl?U.doubles:U.singles)} · ${TI(U[S.track])}</div></div></div>
    <div class="facts">${facts.join('')}</div>
    ${d.goal?`<div class="blk"><h3>${u('goal')}</h3><p>${T(d.goal)}</p></div>`:''}
    ${d.quest?`<div class="blk quest"><h3>${u('quest')}</h3><p>${T(d.quest)}</p></div>`:''}
    <div class="ready">${ringSVG(p)}<div class="rl"><b>${TI(U.myProg)}</b><br>
      <b>${p.c3}/${p.total}</b> ${TP(U.atC)} · <b>${p.c4}</b> ${TP(U.at4)}${p.need}${TP(U.at4b)}<br>
      <span class="chip ${p.ready?'ok':'no'}">${TI(p.ready?U.readyY:U.readyN)}</span></div></div>
  </article>
  <div class="sec-h"><h2>${u('skills')} <small>(${d.skills.length})</small></h2><small>${TP(U.tapHint)}</small></div>
  <div class="chips">${['all',...doms].map(k=>`<button class="fchip" id="dom-${k}" data-domain="${k}" aria-pressed="${S.domain===k}">${k==='all'?TI(U.all):TI(DOMAINS[k])}</button>`).join('')}</div>
  <div class="list">${core.map(row).join('')}</div>
  ${mixed.length?`<div class="mixed-h">${TI(U.mixed)}</div><div class="list">${mixed.map(row).join('')}</div>`:''}`;
}

/* ---------- Render: guide tab ---------- */
function renderGuide(){
  const dbl = S.fmt==='doubles', notes = DATA[S.fmt][S.track].notes;
  return `<div class="card"><h2>${u('grades')}</h2>
    ${GRADES.map(g=>`<div class="grade-row"><div><div class="gnum">${g.n}</div><div class="stars">${stars(g.n)}</div></div>
      <div><b>${TI(g)}</b><div>${T(dbl?g.d:g.s)}</div></div></div>`).join('')}</div>
  <div class="card"><h2>${u('rules')} · ${TI(dbl?U.doubles:U.singles)}</h2><ul class="ul">${RULES[S.fmt].map(r=>`<li>${T(r)}</li>`).join('')}</ul></div>
  <div class="card"><h2>${u('notes')} · ${TI(U[S.track])}</h2><ul class="ul">${notes.map(n=>`<li>${T(n)}</li>`).join('')}</ul>
    <div id="resetBox" style="margin-top:14px">${resetUI(false)}</div></div>`;
}
function resetUI(confirming){
  return confirming
    ? `<div class="confirm"><span style="flex:1">${TI(U.resetQ)}</span><button class="btn pri" id="resetYes">${TI(U.yes)}</button><button class="btn" id="resetNo">${TI(U.no)}</button></div>`
    : `<button class="btn" id="resetAsk" style="width:100%">${TI(U.reset)}</button>`;
}

/* ---------- Render: assessment tab ---------- */
function calcResult(){
  const w = WEIGHTS[S.fmt], c = S.calc;
  const total = Math.round(c.p/4*w.p + c.t/100*w.t + c.m/4*w.m);
  let lv = BANDS.find(b => total>=b[0] && total<=b[1])[2];
  let capped = false;
  if(S.fmt==='doubles' && c.singles && lv > c.singles+1){ lv = c.singles+1; capped = true; }
  return {total, lv, capped};
}
function renderAssess(){
  const dbl = S.fmt==='doubles', w = WEIGHTS[S.fmt], r = calcResult();
  return `<div class="card"><h2>${u('flow')} · ${TI(dbl?U.doubles:U.singles)}</h2>
    <ol class="steps">${FLOW[S.fmt].map(f=>`<li><div>${T(f)}</div></li>`).join('')}</ol></div>
  ${dbl?'':`<div class="card"><h2>${u('phys')} · ${TI(U[S.track])}</h2><div class="tbl-wrap"><table>
    <tr><th>#</th><th>${TI(U.test)}</th></tr>${PHYS[S.track].map(p=>`<tr><td class="num">${p[0]}</td><td>${T(p[1])}</td></tr>`).join('')}</table></div>
    <p class="note">${TI({zh:'每项按 1–4 分评分。',en:'Each item is scored 1–4.'})}</p></div>`}
  <div class="card"><h2>${u('stations')}</h2><div class="tbl-wrap"><table>
    <tr><th>#</th><th>${TI(U.test)}</th><th>${TI(U.crit)}</th></tr>
    ${STATIONS[S.fmt].map(s=>`<tr><td class="num">${s[0]}</td><td>${T(s[1])}</td><td>${T(s[2])}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>${u('calc')}</h2><div class="calc">
    <label for="c-p"><span class="row"><span>${TI(U.phys)} <small class="inl-en">(${w.p}%)</small></span><output id="o-p">${S.calc.p.toFixed(1)} / 4</output></span>
      <input type="range" id="c-p" min="1" max="4" step="0.1" value="${S.calc.p}"></label>
    <label for="c-t"><span class="row"><span>${TI({zh:'技术站平均成功率',en:'Average station success'})} <small class="inl-en">(${w.t}%)</small></span><output id="o-t">${S.calc.t}%</output></span>
      <input type="range" id="c-t" min="0" max="100" step="5" value="${S.calc.t}"></label>
    <label for="c-m"><span class="row"><span>${TI({zh:'比赛观察均分',en:'Match observation average'})} <small class="inl-en">(${w.m}%)</small></span><output id="o-m">${S.calc.m.toFixed(1)} / 4</output></span>
      <input type="range" id="c-m" min="1" max="4" step="0.1" value="${S.calc.m}"></label>
    ${dbl?`<label for="c-s"><span class="row"><span>${TI({zh:'当前单打级别',en:'Current singles level'})}</span><output id="o-s">${S.calc.singles?('L'+S.calc.singles):'—'}</output></span>
      <input type="range" id="c-s" min="0" max="6" step="1" value="${S.calc.singles}"></label>`:''}
    <div class="result" id="calcRes">${calcResHTML(r)}</div></div></div>
  <div class="card"><h2>${u('place')}</h2><div class="tbl-wrap"><table>
    <tr><th>${TI(U.band)}</th><th>${TI(U.lvl)}</th></tr>
    ${BANDS.map(b=>`<tr><td class="num">${b[0]}–${b[1]}</td><td>L${b[2]} · ${TI(LEVELS[b[2]-1])}</td></tr>`).join('')}</table></div>
    <p class="note">${T(dbl?{zh:'最终级别 = min（评分建议级别，单打级别 + 1），教练可再调整 ±1 级。',en:'Final level = min(score-based level, singles level + 1). The head coach may adjust ±1.'}
      :{zh:'分数只作参考，教练可调整 ±1 级；有明显短板时就低定级。',en:'The score is a guide. The head coach may adjust ±1, and places lower if there is a major gap.'})}</p></div>`;
}
function calcResHTML(r){
  return `<div class="big">L${r.lv}</div><div><b>${TI(U.suggested)}</b><br>${TI(U.score)} <b>${r.total}</b> / 100 · ${TI(LEVELS[r.lv-1])}
   ${r.capped?`<br><small>${TI({zh:'已按单打级别 +1 封顶',en:'Capped at singles level + 1'})}</small>`:''}</div>`;
}

/* ---------- Bottom sheet ---------- */
function renderSheet(){
  const sheet = document.getElementById('sheet'), d = levelData();
  const s = d.skills.find(x => x.code===openSkill); if(!s) return;
  const dk = domKey(s.code), r = getR(s.code), dbl = S.fmt==='doubles';
  const idx = d.skills.indexOf(s), nxt = d.skills[(idx+1) % d.skills.length];
  sheet.innerHTML = `<div class="grab"></div>
   <div class="sh"><span class="code" style="--dc:var(--d${DOMAINS[dk].c})">${s.code}</span>
     <div style="flex:1;min-width:0"><h2 id="sheetTitle">${T(s)}</h2><div class="dm">${TI(DOMAINS[dk])} · L${S.level} · ${TI(U[S.fmt])} · ${TI(U[S.track])}</div></div>
     <button class="xbtn" id="sheetClose" aria-label="${TP(U.close)}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
   <div class="sb"><p class="hint">${TP(U.sheetHint)}</p><div class="ladder">
   ${GRADES.map(g => { const c = s.grades[g.n], assumed = !c;
     return `<button class="rung ${g.n<=r?'reached':''} ${g.n===r?'current':''} ${assumed?'assumed':''}" data-me="${esc(TP(U.me))}" data-grade="${g.n}" id="g-${g.n}" ${assumed?'disabled':''}>
       <div><div class="gnum">${g.n}</div><div class="stars">${stars(g.n)}</div></div>
       <div><div class="gname">${TI(g)}</div><div class="gdef">${TP(dbl?g.d:g.s)}</div>
       <div class="crit"><small>${TP(U.criterion)}</small>${assumed?TI(U.assumed):T(c)}</div></div></button>`; }).join('')}
   </div><div class="acts"><button class="btn" id="clearR">${TI(U.clear)}</button>
     <button class="btn pri" id="nextSk" data-next="${nxt.code}">${TI(U.next)} →</button></div></div>`;
}
function openSheet(code){
  openSkill = code; renderSheet();
  const sh = document.getElementById('sheet'), sc = document.getElementById('scrim');
  sh.hidden = false; sc.hidden = false;
  requestAnimationFrame(() => { sh.classList.add('show'); sc.classList.add('show'); document.getElementById('sheetClose').focus(); });
}
function closeSheet(){
  const sh = document.getElementById('sheet'), sc = document.getElementById('scrim');
  sh.classList.remove('show'); sc.classList.remove('show');
  const back = openSkill; openSkill = null;
  setTimeout(() => { sh.hidden = true; sc.hidden = true; }, 220);
  renderView(); const el = document.getElementById('sk-'+back); if(el) el.focus({preventScroll:true});
}

/* ---------- Main render ---------- */
function renderView(){
  const v = document.getElementById('view');
  v.innerHTML = S.tab==='levels' ? renderLevels() : S.tab==='guide' ? renderGuide() : renderAssess();
  if(S.tab==='levels'){ const t = document.getElementById('lvl-'+S.level), rail = document.getElementById('rail');
    if(t && rail) rail.scrollLeft = Math.max(0, t.offsetLeft - rail.clientWidth/2 + t.clientWidth/2); }
}
function renderAll(){ renderChrome(); renderView(); if(openSkill) renderSheet(); }

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-x]'); if(!b){ return; }
  if(b.dataset.lang){ S.lang=b.dataset.lang; store.set('lang',S.lang); renderAll(); return; }
  if(b.dataset.fmt){ S.fmt=b.dataset.fmt; store.set('fmt',S.fmt); S.domain='all'; renderAll(); return; }
  if(b.dataset.track){ S.track=b.dataset.track; store.set('track',S.track); S.domain='all'; renderAll(); return; }
  if(b.dataset.tab){ S.tab=b.dataset.tab; renderChrome(); renderView(); window.scrollTo({top:0}); return; }
  if(b.dataset.level){ S.level=+b.dataset.level; store.set('level',S.level); S.domain='all'; renderView(); return; }
  if(b.dataset.domain){ S.domain=b.dataset.domain; renderView(); return; }
  if(b.dataset.skill){ openSheet(b.dataset.skill); return; }
  if(b.dataset.grade){ const g=+b.dataset.grade, k=rKey(openSkill); ratings[k] = ratings[k]===g ? g-1 : g;
    if(!ratings[k]) delete ratings[k]; store.set('ratings',ratings); renderSheet(); return; }
  if(b.id==='clearR'){ delete ratings[rKey(openSkill)]; store.set('ratings',ratings); renderSheet(); return; }
  if(b.id==='nextSk'){ openSkill=b.dataset.next; renderSheet(); return; }
  if(b.id==='sheetClose'){ closeSheet(); return; }
  if(b.id==='resetAsk'){ document.getElementById('resetBox').innerHTML = resetUI(true); return; }
  if(b.id==='resetNo'){ document.getElementById('resetBox').innerHTML = resetUI(false); return; }
  if(b.id==='resetYes'){ const pre = `${S.fmt}/${S.track}/`; Object.keys(ratings).forEach(k => k.startsWith(pre) && delete ratings[k]);
    store.set('ratings',ratings); renderView(); return; }
});
document.getElementById('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key==='Escape' && openSkill) closeSheet(); });
document.addEventListener('input', e => {
  const id = e.target.id; if(!id.startsWith('c-')) return;
  const v = +e.target.value, k = id.slice(2);
  if(k==='p'){ S.calc.p=v; document.getElementById('o-p').textContent = v.toFixed(1)+' / 4'; }
  if(k==='t'){ S.calc.t=v; document.getElementById('o-t').textContent = v+'%'; }
  if(k==='m'){ S.calc.m=v; document.getElementById('o-m').textContent = v.toFixed(1)+' / 4'; }
  if(k==='s'){ S.calc.singles=v; document.getElementById('o-s').textContent = v?('L'+v):'—'; }
  document.getElementById('calcRes').innerHTML = calcResHTML(calcResult());
});
/* Swipe down on the sheet header to close */
(() => { let y0=null; const sh=document.getElementById('sheet');
  sh.addEventListener('touchstart', e => { if(e.target.closest('.sh,.grab')) y0=e.touches[0].clientY; }, {passive:true});
  sh.addEventListener('touchend', e => { if(y0!==null && e.changedTouches[0].clientY - y0 > 60) closeSheet(); y0=null; }, {passive:true});
})();

renderAll();
</script>
</body>
</html>
