/* ---------- State ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem('bp2:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('bp2:'+k,JSON.stringify(v))}catch(e){}}

const S = {lang:store.get('lang','bi'), fmt:store.get('fmt','singles'), track:store.get('track','kids'),

/* ---------- Helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function T(o){ if(!o) return ''; const z=esc(o.zh), e=esc(o.en);
  if(S.lang==='zh') return z; if(S.lang==='en') return e; return z===e ? z : `${z}<span class="en">${e}</span>`; }
function TI(o){ if(!o) return ''; const z=esc(o.zh), e=esc(o.en);
  if(S.lang==='zh') return z; if(S.lang==='en') return e; return z===e ? z : `${z} <span class="inl-en">${e}</span>`; }
function TP(o){ return S.lang==='en' ? o.en : o.zh; }
const u = k => TI(U[k]);
const trk = () => DATA[S.fmt][S.track];
const threads = () => trk().threads;
const lvKeys = th => Object.keys(th.lv).map(Number).sort((a,b)=>a-b);
const first = th => lvKeys(th)[0];
const at = n => threads().filter(th => th.lv[n]);
const isNew = (th,n) => first(th) === n;
const findTh = code => threads().find(t => t.code===code);
const rKey = (code,n) => `${S.fmt}/${S.track}/${code}/L${n}`;
const getR = (code,n) => ratings[rKey(code,n)] || 0;
const needApplied = n => n <= 2 ? 2 : 3;
const stars = n => '★'.repeat(n);
const tag = (th,n) => isNew(th,n) ? `<span class="tag new">${esc(TP(U.isNew))}</span>` : `<span class="tag re">${esc(TP(U.isRe))}</span>`;

function progressFor(n){
  const sk = at(n);
  const c3 = sk.filter(s => getR(s.code,n) >= 3).length, c4 = sk.filter(s => getR(s.code,n) >= 4).length;
  return {total:sk.length, c3, c4, need:needApplied(n), ready: sk.length>0 && c3===sk.length && c4>=needApplied(n)};
}
function pathBar(th,n){
  const ks = lvKeys(th), fut = ks.filter(k=>k>n).length;
  const bars = [1,2,3,4,5,6].map(k => `<i class="${!th.lv[k]?'':k<n?'past':k===n?'cur':'fut'}"></i>`).join('');
  return `<span class="path" aria-label="L${ks[0]}–L${ks[ks.length-1]}">${bars}${fut?`<small>→ L${ks[ks.length-1]}</small>`:''}</span>`;
}

    ${pct?`<circle class="fgc" cx="27" cy="27" r="${r}" stroke-dasharray="${(pct*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 27 27)"/>`:''}
    <text x="27" y="32" text-anchor="middle">${p.c3}/${p.total}</text></svg>`;
}
function skillRow(th, n){
  const dm = DOMAINS[th.dom], r = getR(th.code,n);

function renderLevels(){

      <div class="ln">L${l.n}${kids?`<span class="bdg">${l.e}</span>`:''}</div>
      <div class="nm">${kids ? TI(dbl?l.kd:l.ks) : TI(l)}</div>

  const facts = [`<span class="fact">${TI(U.profile)} · <b>${TI(dbl?L.dp:(kids?L:L.ap))}</b></span>`];

  const here = at(n), nNew = here.filter(t=>isNew(t,n)).length, p = progressFor(n);

  return `<div class="rail" id="rail">${rail}</div>
  <article class="panel">
    <div class="ptitle"><div class="big">L${n}</div><div>
      <h2>${kids ? `${L.e} ${TI(dbl?L.kd:L.ks)}` : TI(L)}</h2>

    ${meta.goal?`<div class="blk"><h3>${u('goal')}</h3><p>${T(meta.goal)}</p></div>`:''}
    <div class="mix"><div class="n"><b>${nNew}</b>${TI(U.nNew)}</div><div class="r"><b>${here.length-nNew}</b>${TI(U.nRe)}</div></div>
    ${meta.quest?`<div class="blk quest"><h3>${u('quest')}</h3><p>${T(meta.quest)}</p></div>`:''}
    <div class="ready">${ringSVG(p)}<div class="rl"><b>${TI(U.myProg)}</b><br>
      <b>${p.c3}/${p.total}</b> ${TP(U.atC)} · <b>${p.c4}</b> ${TP(U.at4)}${p.need}${TP(U.at4b)}<br>
      <span class="chip ${p.ready?'ok':'no'}">${TI(p.ready?U.readyY:U.readyN)}</span></div></div>
  </article>
  <div class="sec-h"><h2>${u('skills')} <small>(${here.length})</small></h2><small>${TP(U.tapHint)}</small></div>
  <div class="chips">${[['all',U.all],['new',U.isNew],['re',U.isRe]].map(([k,l])=>`<button class="fchip" id="type-${k}" data-type="${k}" aria-pressed="${S.type===k}">${TI(l)}</button>`).join('')}</div>
  <div class="chips">${['all',...doms].map(k=>`<button class="fchip" id="dom-${k}" data-domain="${k}" aria-pressed="${S.domain===k}">${k==='all'?TI(U.all):TI(DOMAINS[k])}</button>`).join('')}</div>

/* ---------- Assessment tab ---------- */
function calcResult(){
  const w = WEIGHTS[S.fmt], c = S.calc;
  const total = Math.round(c.p/4*w.p + c.t/100*w.t + c.m/4*w.m);
  let lv = BANDS.find(b => total>=b[0] && total<=b[1])[2], capped = false;
  if(S.fmt==='doubles' && c.singles && lv > c.singles+1){ lv = c.singles+1; capped = true; }
  return {total, lv, capped};
}
function calcResHTML(r){
  return `<div class="big">L${r.lv}</div><div><b>${TI(U.suggested)}</b><br>${TI(U.score)} <b>${r.total}</b> / 100 · ${TI(LEVELS[r.lv-1])}
   ${r.capped?`<br><small>${TI({zh:'已按单打级别 +1 封顶',en:'Capped at singles level + 1'})}</small>`:''}</div>`;
}

      <input type="range" id="c-m" min="1" max="4" step="0.1" value="${S.calc.m}"></label>

     ${past.length?`<div class="prev"><small>${TP(U.prev)} · L${past[past.length-1]}</small>${T(th.lv[past[past.length-1]].t)}</div>`:''}
     ${potRows.length?`<div class="pot"><h3 style="color:var(--warn)">${TP(U.pot)}</h3>${potRows.map(k=>`<div class="row"><span class="lv">L${k}</span><span>${T(th.lv[k].t)}</span></div>`).join('')}</div>`:''}
     <div><h3>${u('grades')}</h3><p class="hint">${TP(U.saved)}</p><div class="ladder">
     ${GRADES.map(g => `<button class="rung ${g.n<=r?'reached':''} ${g.n===r?'current':''}" data-me="${esc(TP(U.me))}" data-grade="${g.n}" id="g-${g.n}">
         <div><div class="gnum">${g.n}</div><div class="stars">${stars(g.n)}</div></div>
         <div><div class="gname">${TI(g)}</div><div class="gdef">${g.n===3?`${esc(TP(U.stdM))}: ${esc(TP(cur.m))}`:esc(TP(dbl&&g.n===4?GRADES_D4:g.s))}</div></div></button>`).join('')}
     </div></div>
     <div><h3>${u('path')}</h3><div class="tl">
     ${[1,2,3,4,5,6].map(k => { const v = th.lv[k];
       if(!v) return `<button class="off" disabled><span class="lv">L${k}</span><span class="tx">—</span></button>`;
       const cls = k<n?'past':k===n?'cur':'fut', st = k===n?U.stCur:k<n?(k===ks[0]?U.stFirst:U.stPast):U.stFut;
       return `<button class="${cls}" data-goto="${k}" id="tl-${k}"><span class="lv">L${k}</span><span class="tx"><div class="st">${esc(TP(st))}</div>${T(v.t)}</span></button>`; }).join('')}
     </div></div>
     <div class="acts"><button class="btn" id="clearR">${TI(U.clear)}</button>
       <button class="btn pri" id="nextSk" data-next="${nxt.code}">${TI(U.next)} →</button></div>
   </div>`;
}
function openSheet(code){
  openCode = code; renderSheet();
  const sh = document.getElementById('sheet'), sc = document.getElementById('scrim');
  sh.hidden = false; sc.hidden = false;
  requestAnimationFrame(() => { sh.classList.add('show'); sc.classList.add('show'); document.getElementById('sheetClose').focus(); });
}
function closeSheet(){
  const sh = document.getElementById('sheet'), sc = document.getElementById('scrim');
  sh.classList.remove('show'); sc.classList.remove('show');
  const back = openCode; openCode = null;
  setTimeout(() => { sh.hidden = true; sc.hidden = true; }, 220);
  renderView(); const el = document.getElementById('sk-'+back); if(el) el.focus({preventScroll:true});
}

/* ---------- Main ---------- */
function renderView(){
  const v = document.getElementById('view');
  v.innerHTML = S.tab==='levels' ? renderLevels() : S.tab==='guide' ? renderGuide() : renderAssess();
  if(S.tab==='levels'){ const t = document.getElementById('lvl-'+S.level), rail = document.getElementById('rail');
    if(t && rail) rail.scrollLeft = Math.max(0, t.offsetLeft - rail.clientWidth/2 + t.clientWidth/2); }
}
function renderAll(){ renderChrome(); renderView(); if(openCode) renderSheet(); }
function setLevel(n){ S.level = n; store.set('level', n); }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.lang){ S.lang=d.lang; store.set('lang',S.lang); renderAll(); return; }
  if(d.fmt){ S.fmt=d.fmt; store.set('fmt',S.fmt); S.domain='all'; if(openCode) closeSheet(); renderAll(); return; }
  if(d.track){ S.track=d.track; store.set('track',S.track); S.domain='all'; if(openCode) closeSheet(); renderAll(); return; }
  if(d.tab){ S.tab=d.tab; renderChrome(); renderView(); window.scrollTo({top:0}); return; }
  if(d.level){ setLevel(+d.level); S.domain='all'; renderView(); return; }
  if(d.domain){ S.domain=d.domain; renderView(); return; }
  if(d.type){ S.type=d.type; renderView(); return; }
  if(d.skill){ openSheet(d.skill); return; }
  if(d.jump){ setLevel(+d.lv); S.tab='levels'; S.domain='all'; S.type='all'; renderChrome(); renderView(); openSheet(d.jump); return; }
  if(d.goto){ setLevel(+d.goto); renderView(); renderSheet(); document.querySelector('#sheet .sb').scrollTop = 0; return; }
  if(d.grade){ const g=+d.grade, k=rKey(openCode,S.level); ratings[k] = ratings[k]===g ? g-1 : g;
    if(!ratings[k]) delete ratings[k]; store.set('ratings',ratings); renderSheet(); return; }
  if(b.id==='clearR'){ delete ratings[rKey(openCode,S.level)]; store.set('ratings',ratings); renderSheet(); return; }
  if(b.id==='nextSk'){ openCode=d.next; renderSheet(); document.querySelector('#sheet .sb').scrollTop = 0; return; }
  if(b.id==='sheetClose'){ closeSheet(); return; }
  if(b.id==='resetAsk'){ document.getElementById('resetBox').innerHTML = resetUI(true); return; }
  if(b.id==='resetNo'){ document.getElementById('resetBox').innerHTML = resetUI(false); return; }
  if(b.id==='resetYes'){ const pre = `${S.fmt}/${S.track}/`; Object.keys(ratings).forEach(k => k.startsWith(pre) && delete ratings[k]);
    store.set('ratings',ratings); renderView(); return; }
});
document.getElementById('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key==='Escape' && openCode) closeSheet(); });
document.addEventListener('input', e => {
  const id = e.target.id; if(!id.startsWith('c-')) return;
  const v = +e.target.value, k = id.slice(2);
  if(k==='p'){ S.calc.p=v; document.getElementById('o-p').textContent = v.toFixed(1)+' / 4'; }
  if(k==='t'){ S.calc.t=v; document.getElementById('o-t').textContent = v+'%'; }
  if(k==='m'){ S.calc.m=v; document.getElementById('o-m').textContent = v.toFixed(1)+' / 4'; }
  if(k==='s'){ S.calc.singles=v; document.getElementById('o-s').textContent = v?('L'+v):'—'; }
  document.getElementById('calcRes').innerHTML = calcResHTML(calcResult());
});
(() => { let y0=null; const sh=document.getElementById('sheet');
  sh.addEventListener('touchstart', e => { if(e.target.closest('.sh,.grab')) y0=e.touches[0].clientY; }, {passive:true});
  sh.addEventListener('touchend', e => { if(y0!==null && e.changedTouches[0].clientY - y0 > 60) closeSheet(); y0=null; }, {passive:true});
})();

renderAll();
</script>
</body>
</html>
