<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecomwin Card Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif;background:#FBFAF7;color:#14181F;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
  .card{background:#fff;border:1px solid #E3DFD6;border-radius:20px;padding:36px 32px;max-width:440px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(20,24,31,.06)}
  .stamp{display:inline-block;border-radius:99px;padding:8px 18px;font-weight:700;font-size:14px;letter-spacing:.04em}
  .stamp.ok{background:#0E7C6B;color:#fff}.stamp.no{background:#B3261E;color:#fff}.stamp.live{background:#C98A1B;color:#fff}
  h1{font-size:22px;margin:18px 0 4px;font-family:'Space Grotesk',sans-serif}
  .name{font-size:16px;color:#6B6F76;margin-bottom:18px}
  .row{text-align:left;background:#F6F4EE;border-radius:12px;padding:12px 16px;margin:8px 0;font-size:14px}
  .row b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6B6F76;margin-bottom:2px}
  .footer{margin-top:20px;font-size:12px;color:#A9ADA4}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#14181F;color:#7FD8C6;border-radius:8px;padding:4px 10px;display:inline-block}
  .brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#0E7C6B;font-weight:700;margin-bottom:4px}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand">Ecomwin Card Registry</div>
    <div id="status"><span class="stamp live">CHECKING…</span></div>
    <h1 id="title">Verifying card code…</h1>
    <div id="detail"></div>
    <div class="footer" id="footer">Verification by Ecomwin · reallife.sg</div>
  </div>
<script>
(function () {
  var code = (new URLSearchParams(location.search).get('v') || location.pathname.split('/').pop() || '').toUpperCase();
  var card = document.getElementById('card');
  var status = document.getElementById('status');
  var title = document.getElementById('title');
  var detail = document.getElementById('detail');

  function row(k, v) { return '<div class="row"><b>' + k + '</b>' + v + '</div>'; }
  function esc(s) { return String(s || '').replace(/[<>&"]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]; }); }

  fetch('data/cards.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (data) {
    var entries = Array.isArray(data) ? data : (data.cards || []);
    var found = entries.find(function (e) { return (e.code || '').toUpperCase() === code; });
    if (!code) {
      status.innerHTML = '<span class="stamp live">HOW IT WORKS</span>';
      title.textContent = 'Ecomwin Card Registry';
      detail.innerHTML = row('What is this?', 'Every QR name card issued by Ecomwin systems carries a verification code. Enter it after <code class="code">/verify?v=</code> — or just scan the QR — to confirm the card is registered.');
      return;
    }
    if (!found) {
      status.innerHTML = '<span class="stamp no">⚠ NOT IN REGISTRY</span>';
      title.textContent = 'Code not found';
      detail.innerHTML = row('Code checked', '<span class="code">' + esc(code) + '</span>') +
        row('Result', 'No card with this code is registered with the Ecomwin Card Registry. Proceed with caution — this card cannot be verified.');
      return;
    }
    var revoked = found.status === 'revoked';
    status.innerHTML = revoked ? '<span class="stamp no">🚫 REVOKED</span>' : '<span class="stamp ok">✓ VERIFIED</span>';
    title.textContent = esc(found.name || 'Registered card');
    detail.innerHTML =
      row('Card holder', esc(found.name || '—')) +
      row('Company', esc(found.org || '—')) +
      row('Title', esc(found.title || '—')) +
      row('Registered', esc(found.issued || '—')) +
      row('Issuer', 'Ecomwin Card Registry (reallife.sg)') +
      row('Code', '<span class="code">' + esc(code) + '</span>') +
      (revoked ? row('Status', '<b style="color:#B3261E">This card has been revoked by its issuer.</b>') : '');
  }).catch(function () {
    status.innerHTML = '<span class="stamp no">⚠ ERROR</span>';
    title.textContent = 'Registry unavailable';
    detail.innerHTML = row('Note', 'The registry could not be loaded. Please try again shortly.');
  });
})();
</script>
</body>
</html>
